<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula - Smart File Organizer</title>
    <style>
        /* Modern UI/UX Styling for Nebula */
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .brand-name {
            font-size: 3rem;
            margin: 0 0 5px 0;
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 35px;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .upload-area {
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px 20px;
            background-color: #f9fafb;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background-color: #e0e7ff;
        }

        input[type="file"] {
            font-size: 1rem;
            color: var(--text-main);
            width: 100%;
            cursor: pointer;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 40px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .footer span {
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-name">Nebula</h1>
        <p class="subtitle">Smart File Organizer</p>
        
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-area">
                <!-- webkitdirectory allows users to select an entire folder -->
                <input type="file" name="files" id="fileInput" multiple webkitdirectory directory required>
            </div>
            <button type="submit">Organize & Download ZIP</button>
        </form>
    </div>

    <div class="footer">
        Created by <span>Arnab Adhikari</span>
    </div>

</body>
</html>
